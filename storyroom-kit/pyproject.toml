[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyroom-kit"
version = "0.1.0"
description = "Story-aware cinematic graphics for documentary narration (Casefile Studio's engine, on its own)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=11,<13", "numpy>=2.1,<3"]

[project.optional-dependencies]
ffmpeg = ["ffmpeg-binaries==1.1.0"]
test = ["pytest>=8"]

[project.scripts]
storyroom-gfx = "storyroom_kit.cli:main"

[tool.setuptools.packages.find]
include = ["storyroom_kit*"]

[tool.setuptools.package-data]
storyroom_kit = ["fonts/*", "ENGINE_SOURCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
